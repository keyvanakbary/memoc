[package]
name = "memoc"
version = "1.0.1"
edition = "2024"
description = "A small, opinionated static site builder for plain Markdown folders"

[dependencies]
anyhow = "1"
base64 = "0.22"
pdf_oxide = { version = "0.3.78", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
